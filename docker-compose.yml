services:
  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ApiKey: ${OPS_API_KEY:-dev-local-api-key-change-me}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ops_dashboard};Username=${POSTGRES_USER:-ops_dashboard};Password=${POSTGRES_PASSWORD:-ops_dashboard}
      ConnectionStrings__Redis: redis:6379
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_API_KEY: ${OPS_API_KEY:-dev-local-api-key-change-me}
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      OPS_API_URL: http://api:8080
      OPS_API_KEY: ${OPS_API_KEY:-dev-local-api-key-change-me}
      VEHICLE_COUNT: ${VEHICLE_COUNT:-50}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-2}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ops_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-ops_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ops-dashboard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ops-dashboard-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ops-dashboard-postgres:
  ops-dashboard-redis: